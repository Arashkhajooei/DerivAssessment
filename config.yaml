# Evaluation harness configuration.
#
# Every threshold, weight and tunable lives here so that behaviour can be
# changed without touching code, and so that a run's settings can be hashed
# into the run manifest for reproducibility.
schema_version: 1

paths:
  # Inputs (read)
  kb: kb.json
  queries: queries.json
  candidate_answers: candidate_answers.json
  # Artifacts (written)
  retrieval: retrieval.json
  automated_scores: automated_scores.json
  llm_review: llm_review.json
  failure_taxonomy: failure_taxonomy.json
  recommendation: recommendation.md
  review_report: review_report.md
  llm_calls: llm_calls.jsonl
  run_manifest: run_manifest.json

retrieval:
  # Spec mandates the top 2 passages per query.
  top_k: 2
  # BM25 parameters. Fixed values keep scoring reproducible across runs.
  bm25_k1: 1.5
  bm25_b: 0.75
  # Scores are rounded before serialising so output is byte-stable across
  # platforms with different floating point representations.
  score_precision: 4

matching:
  # Rung 2/3: how many unmatched tokens may sit between two pattern tokens
  # before an ordered-subsequence match is rejected.
  max_gap: 2
  enable_stemming: true
  drop_stopwords_in_pattern: true

grounding:
  # Weight on token-overlap precision against retrieved evidence.
  precision_weight: 0.85
  # A verbatim span of at least this many tokens earns the quote bonus.
  min_quote_span: 4
  quote_bonus: 0.15
  # Penalty applied when a number or date in the answer appears nowhere
  # in the retrieved evidence -- a cheap, high-signal hallucination check.
  numeric_penalty: 0.25
  # Below this, a risk_flag is raised even if no single check failed --
  # a broad hint that the answer may be drifting from its evidence.
  low_grounding_threshold: 0.3
  score_precision: 4

risk:
  # Ordinal severity per risk_level value. Higher is more severe.
  levels:
    low: 1
    medium: 2
    high: 3
    critical: 4
  # Unknown risk_level values in a swapped fixture are treated as the most
  # severe tier rather than ignored, so an unrecognised label can never
  # silently weaken the safety gate.
  unknown_severity: 4

gates:
  # A banned-claim violation on a query at or above this severity
  # disqualifies the variant from promotion outright.
  disqualify_must_not_claim_at_severity: 3

aggregation:
  weights:
    retrieval_hit: 0.10
    must_include_pass: 0.20
    must_not_claim_pass: 0.25
    grounding_score: 0.20
    judge_faithfulness: 0.15
    judge_clarity: 0.05
    judge_winner_vote: 0.05
  # Composite margin below which no variant is declared a clear winner.
  min_margin_for_promotion: 0.02
  score_precision: 4

judge:
  # Which live-backend provider to call. Supported: anthropic, openai.
  # The provider is part of the LLM cache key, so switching it correctly
  # invalidates cached calls rather than replaying another provider's
  # answer.
  provider: openai
  model: gpt-4o-mini
  temperature: 0
  max_tokens: 4096
  # Allowed integer range for faithfulness and clarity scores.
  score_min: 1
  score_max: 5
  # Retries on malformed or schema-invalid structured output.
  max_retries: 1
  # Resolution order. First backend that can serve the call wins.
  #   cache -> replay a previously logged call, zero cost, offline
  #   live  -> real API call, requires a key
  #   stub  -> deterministic rule-derived verdicts, always available
  backend_order: [cache, live, stub]
